name: Cue
options:
  bundleIdPrefix: app.cueprompter
  deploymentTarget:
    iOS: "16.0"
  # A fresh clone has no Signing.xcconfig — generation must still succeed.
  disabledValidations:
    - missingConfigFiles
# Signing lives in a gitignored local file so the team ID stays out of the
# public repo, and so it survives regeneration — setting it in Xcode's UI
# does not, because the project file is rebuilt from this one.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
targets:
  Cue:
    type: application
    platform: iOS
    sources:
      - path: Cue
    info:
      path: Cue/Info.plist
      properties:
        UILaunchScreen: {}
        # The home-screen name, deliberately separate from the App Store
        # listing name ("On Cue Teleprompter") — that one has to be globally
        # unique, this one only has to fit under the icon without truncating.
        CFBundleDisplayName: "On Cue"
        # Bump CFBundleVersion for every TestFlight upload — App Store Connect
        # rejects a build number it has already seen.
        CFBundleShortVersionString: "1.4"
        CFBundleVersion: "4"
        # Cue makes no network connections and uses no encryption beyond
        # what the OS provides, so this answers the export-compliance
        # question up front instead of on every upload.
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: "On Cue listens to your voice to scroll the script as you speak."
        NSSpeechRecognitionUsageDescription: "On Cue uses on-device speech recognition to track your place in the script."
        NSCameraUsageDescription: "On Cue uses the front camera to record your take."
        NSPhotoLibraryAddUsageDescription: "On Cue saves finished recordings to your Photos library."
    dependencies:
      - target: CueShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cueprompter.Cue
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Cue/Cue.entitlements
        # DEVELOPMENT_TEAM deliberately absent: an empty value here would
        # override the one coming from Signing.xcconfig and reset Team to None.
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  CueShare:
    type: app-extension
    platform: iOS
    sources:
      - path: CueShare
      - path: Cue/Models/SharedScriptInbox.swift
      - path: Cue/Models/ScriptImporter.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cueprompter.Cue.Share
        PRODUCT_NAME: CueShare
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: CueShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: CueShare/CueShare.entitlements
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES

  CueTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CueTests
    dependencies:
      - target: Cue
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Cue.app/Cue"
        BUNDLE_LOADER: "$(TEST_HOST)"
        PRODUCT_BUNDLE_IDENTIFIER: app.cueprompter.CueTests
  CueUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CueUITests
    dependencies:
      - target: Cue
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.cueprompter.CueUITests
        TEST_TARGET_NAME: Cue
schemes:
  Cue:
    build:
      targets:
        Cue: all
        CueTests: [test]
        CueUITests: [test]
    test:
      targets:
        - CueTests
        - CueUITests
    run:
      config: Debug
